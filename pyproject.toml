# Quality configuration only. Controller is built from controller/pyproject.toml.
[tool.ruff]
target-version = "py311"
extend-exclude = ["experiments/disc_assistant/assistant/nlu/data", "controller/build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
files = [
  "controller/models.py", "controller/wire.py", "controller/contracts.py",
  "controller/compatibility.py", "controller/operations.py", "controller/current.py",
  "controller/controls.py", "controller/session.py", "controller/link_commands.py", "controller/sound.py",
  "ci/controller_types.py",
  "experiments/disc_assistant/assistant/controller_results.py",
]

# Incremental boundary: these modules still invoke legacy catalog/transport
# helpers. Their own signatures and bodies are checked; new public results and
# wire decoders use strict mode without this exception.
[[tool.mypy.overrides]]
module = ["controller.session", "controller.controls", "controller.link_commands", "controller.sound"]
disallow_untyped_calls = false
