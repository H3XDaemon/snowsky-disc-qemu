# Always use the launcher, or explicit --project-directory <repo-root> and --env-file.
# Container for the Snowsky Disc qemu emulator.
#
# 1. Point it at the firmware OTA chunk dir (…/main_os/ota_v257 of the unzipped firmware):
#      cp emulator/.env.example emulator/.env   &&   edit OTA_DIR   (or: OTA_DIR=/path ./emulator/run.sh up)
# 2. Start it:
#      ./emulator/run.sh compose up -d --build        (or ./emulator/run.sh up "$OTA_DIR", which also extracts+sets up)
# 3. Drive the pipeline (extract / setup / boot / tap …) with ./emulator/run.sh — see README.md.
#
# emulator idles (`sleep infinity`); ./emulator/run.sh execs its /repo/emulator/scripts/* pipeline.
# Optional wsbridge profile: ./emulator/run.sh compose --profile wsbridge up -d
# Separate unprivileged native service; no MIPS rootfs changes.
# Opt-in phone LAN testing uses controller/bridge/lan_bridge.py on the host (controller/docs/discovery.md).
# Keep these Docker publications loopback-only; no automatic LAN exposure.
name: snowsky-disc-qemu

services:
  emulator:
    build: ./emulator/docker
    image: ${EMU_IMAGE:-snowsky-disc-qemu}
    container_name: ${EMU_CONTAINER_NAME:-snowsky-disc-qemu}
    privileged: true                     # qemu-user needs binfmt_misc, POSIX mqueue, a large VA reservation
    command: sleep infinity
    environment:
      FW_VERSION: "${FW_VERSION:-}"     # exact-build profile; use a separate volume per version
      LANG_CODE: ${LANG_CODE:-2}
      GUEST_TTL: ${GUEST_TTL:-1800}     # seconds; 0 = no limit
      BOOT_MODE: ${BOOT_MODE:-direct}   # direct, or init = stock rcS/fiio_init.sh (docs/stock-init.md)
      USERDATA_MB: ${USERDATA_MB:-}     # set once (e.g. 83) to make /usr/data a size-limited image
      SDCARD_KEEP: ${SDCARD_KEEP:-0}    # 1 = setup keeps the existing card image
      NETWORK: ${NETWORK:-shared}       # shared, or isolated = own namespace with no interface
      WLAN0: ${WLAN0:-0}                # 1 = emulated wlan0 (dummy link); WLAN0_STATE/_ADDR/_MAC
      WLAN0_STATE: ${WLAN0_STATE:-}
      WLAN0_ADDR: ${WLAN0_ADDR:-}
      WLAN0_MAC: ${WLAN0_MAC:-}
      SDCARD_MB: ${SDCARD_MB:-}         # card size in MiB (default: content + 32)
      SDCARD_FS: ${SDCARD_FS:-vfat}     # vfat or exfat
      SDCARD_PARTITION: ${SDCARD_PARTITION:-0} # 1 = MBR + one partition, like a real card
      # Guest environment presets (emulator/docs/environment.md); empty keeps the defaults.
      POWER_WATCH: ${POWER_WATCH:-0}    # 1 = direct boot serves the idle power-off without a viewer
      USB_POWER: ${USB_POWER:-}         # 1/0 = cable state at every boot; empty = stored state
      BATTERY_PROFILE: ${BATTERY_PROFILE:-}   # legacy (default) or device
      BATTERY_CAPACITY: ${BATTERY_CAPACITY:-}
      BATTERY_VOLTAGE_UV: ${BATTERY_VOLTAGE_UV:-}
      BATTERY_TEMP: ${BATTERY_TEMP:-}
      DEVICE_SN: ${DEVICE_SN:-}         # 14 characters -> /usr/data/fiio/sn.txt
      SETTINGS_PROFILE: ${SETTINGS_PROFILE:-} # emulator (default), factory, always-on
      SETTINGS: ${SETTINGS:-}           # COLUMN=INT,... on top of the profile
      STREAM_FPS: ${STREAM_FPS:-12}
      DEVICE_BOOT_SCRIPT: ${DEVICE_BOOT_SCRIPT:-} # empty keeps the stock viewer Power-on path
    stop_grace_period: 2s
    networks:
      default:
        interface_name: eth1             # stock wired path; requires Compose >= 2.36
    volumes:
      - ${OTA_DIR:?set OTA_DIR in emulator/.env (path to the firmware main_os/ota_v257 dir)}:/ota:ro
      - ./:/repo                         # this repository (all components)
      - ${SD_DIR:-./emulator/sdcard}:/sdcard       # CI supplies an isolated generated library
      - work:/work                       # extracted rootfs + runtime state (persists across restarts)
    ports:
      # FiiO Link services the emulated device binds. Lets a host client
      # reach the emulated player. See docs/protocol/protocol.md.
      # Comment out any that clash with something already on your host.
      - "127.0.0.1:12100:12100"          # auth-free control: never expose to LAN by default
      - "127.0.0.1:12113:12103"          # direct stock HTTP, without the WebSocket bridge
      - "127.0.0.1:12101:12101/udp"      # does not relay LAN multicast discovery
      - "127.0.0.1:8080:8080"            # live viewer + touch bridge

  wsbridge:
    profiles: [wsbridge]
    image: ${EMU_IMAGE:-snowsky-disc-qemu}
    pull_policy: never                   # reuse the image built by emulator, not a registry image
    depends_on:
      - emulator
    command: ["python3", "-B", "-m", "controller.bridge.ws_bridge", "--listen", "0.0.0.0", "--upstream", "emulator", "--http-port", "12103"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 5s
    volumes:
      - ./:/repo:ro
    ports:
      - "127.0.0.1:12103:12103"          # /api/websocket -> TCP; other HTTP -> stock 12103
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:12103/bridge/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  work:
    name: ${WORK_VOLUME:-snowsky-disc-work} # CI must never reuse the interactive work volume
