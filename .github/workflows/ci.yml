name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Firmware-free checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Local documentation links
        run: python3 -m ci.docs
      - name: Pinned Docker Engine
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          version: v28.5.2
      - name: Pinned Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
        with:
          version: v2.39.4
          cache-binary: false
      - name: Validate Compose
        run: OTA_DIR=/tmp/unused docker compose --project-directory . --env-file /dev/null -f emulator/compose.yaml config --quiet
      - name: Python types, lint and installed Controller wheel
        run: |
          python3 -m venv /tmp/disc-quality
          /tmp/disc-quality/bin/pip install -r ci/requirements-quality.txt
          PATH="/tmp/disc-quality/bin:$PATH" bash ci/python-quality.sh
      - name: Build pinned toolchain
        run: docker build --tag snowsky-disc-qemu-ci emulator/docker
      - name: Python, JavaScript, shell syntax and MIPS shims
        run: docker run --rm --network none --volume "$PWD:/repo:ro" snowsky-disc-qemu-ci bash /repo/ci/test.sh
