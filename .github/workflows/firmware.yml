name: Firmware integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-active
  cancel-in-progress: false
jobs:
  integration:
    name: Fresh active firmware integration
    if: github.ref == 'refs/heads/2.x'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Docker Engine
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          version: v28.5.2
      - name: Pinned Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
        with:
          version: v2.39.4
          cache-binary: false
      - name: Build pinned toolchain and run firmware-free checks
        run: |
          docker build --tag snowsky-disc-qemu-ci emulator/docker
          docker run --rm --network none --volume "$PWD:/repo:ro" snowsky-disc-qemu-ci bash /repo/ci/test.sh
      - name: Select reviewed active firmware
        id: firmware
        run: |
          echo "FW_VERSION=$(cat firmware/active-version)" >> "$GITHUB_ENV"
          echo "url_secret=$(python3 -m firmware.profile get url_secret)" >> "$GITHUB_OUTPUT"
      - name: Download private firmware input
        env:
          FIRMWARE_URL: ${{ secrets[steps.firmware.outputs.url_secret] }}
        run: |
          mkdir "$RUNNER_TEMP/snowsky-disc-ota"
          python3 -B -m firmware.tools.fetch_firmware "$RUNNER_TEMP/snowsky-disc-ota" --version "$FW_VERSION"
      - name: Fresh boot, stock library scan, TCP, WebSocket and PCM
        run: bash ci/integration.sh "$RUNNER_TEMP/snowsky-disc-ota"
      # No firmware/rootfs/guest logs/caches/images are uploaded. The hosted runner
      # is disposable. Never run this workflow against fork code or on self-hosted.
